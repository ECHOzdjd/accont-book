spring:
  application:
    name: accont-book

  # MySQL DataSource
  datasource:
    url: jdbc:mysql://localhost:3306/accont_book?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: accont
    password: accont123
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis Configuration
